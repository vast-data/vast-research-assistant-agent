<form class="chat" [class.chat_transparent]="transparentMode" [class.focused]="focused" (ngSubmit)="onSubmit()">
    <div class="chat__input">
        <textarea
            (keydown.enter)="$event.preventDefault(); $event.stopPropagation(); onSubmit()"
            (focusin)="focused = true"
            (focusout)="focused = false" 
            matInput
            cdkTextareaAutosize
            [cdkAutosizeMinRows]="2"
            [cdkAutosizeMaxRows]="5"
            placeholder="Reply to your agent..." 
            [(ngModel)]="message"
            [ngModelOptions]="{standalone: true}"></textarea>
    </div>
    <div class="chat__actions">
        <div class="chat__settings-actions">
            <app-collection-selector (collectionsSelected)="onCollectionsSelected($event)"></app-collection-selector>
            @for (mode of modes; track mode.id) {
                <button
                    type="button"
                    class="chat__toggle"
                    [class.chat__toggle--active]="featureSettings.featureMode() === mode.id"
                    (click)="setMode(mode.id)"
                    [attr.aria-pressed]="featureSettings.featureMode() === mode.id"
                    [attr.aria-label]="'Toggle ' + mode.label"
                    [matTooltip]="mode.tooltip">
                    <mat-icon>{{ mode.icon }}</mat-icon>
                    <span class="chat__toggle-text">{{ mode.label }}</span>
                </button>
            }
        </div>
       
        <div class="chat__main-actions">
            <button
                class="chat__send button-icon-s"
                [disabled]="!selectedCollections().length"
                [matTooltip]="!selectedCollections().length ? 'Select at least one collection' : ''"
            >
                <mat-icon svgIcon="send"></mat-icon>
            </button>
        </div>
    </div>
</form>
