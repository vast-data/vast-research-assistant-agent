<header
  class="top-bar"
  role="banner"
>
  <div class="top-bar-content">
    <div class="left-section">
      <button
        type="button"
        aria-label="Open menu"
        class="menu-button"
        (click)="toggleSidebar()"
      >
        <span class="sr-only">Open menu</span>
        <mat-icon svgIcon="sidepanel" class="menu-icon"></mat-icon>
      </button>
      @if (!sidebarOpen()) {
        <a
          routerLink="/chat/new"
          class="new-chat-button"
          aria-label="New conversation"
          matTooltip="New conversation"
          matTooltipPosition="below"
          (click)="onNewChat()"
        >
          <mat-icon svgIcon="new-chat"></mat-icon>
        </a>
      }
      <a routerLink="/chat/new" class="logo-link" (click)="onLogoClick()">
        <img src="/assets/images/vast-logo.png" alt="Vast" class="logo" />
      </a>
    </div>

    <div class="right-section">
      @if (modelInfo()) {
        <div class="model-badge" [matTooltip]="'Provider: ' + modelInfo()!.provider">
          <mat-icon class="model-badge__icon">smart_toy</mat-icon>
          <span class="model-badge__text">{{ modelInfo()!.model_id }}</span>
          <span class="model-badge__provider">{{ modelInfo()!.provider }}</span>
        </div>
      }
      <button
        class="settings-button"
        [matMenuTriggerFor]="settingsMenu"
        aria-label="Settings"
        matTooltip="Settings"
        matTooltipPosition="below">
        <mat-icon>settings</mat-icon>
      </button>
      <mat-menu #settingsMenu="matMenu" class="settings-menu">
        <button mat-menu-item (click)="openSettings()">
          <mat-icon>tune</mat-icon>
          <span>App Settings</span>
          @if (featureSettings.featureMode() !== 'none') {
            <span class="custom-badge">{{ featureModeLabels[featureSettings.featureMode()] }}</span>
          }
        </button>
        <button mat-menu-item (click)="openSystemPrompt()">
          <mat-icon [class.active-prompt]="promptService.hasCustomPrompt()">psychology</mat-icon>
          <span>System Prompt</span>
          @if (promptService.hasCustomPrompt()) {
            <span class="custom-badge">custom</span>
          }
        </button>
        <a mat-menu-item routerLink="/dataflow">
          <mat-icon>animation</mat-icon>
          <span>Data Flow</span>
        </a>
        <a mat-menu-item routerLink="/blueprint">
          <mat-icon>architecture</mat-icon>
          <span>Architecture Blueprint</span>
        </a>
      </mat-menu>
      <app-user-logo [withMenu]="true" [size]="40"></app-user-logo>
    </div>
  </div>
</header>
